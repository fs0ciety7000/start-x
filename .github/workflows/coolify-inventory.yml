name: Coolify inventory

on:
  workflow_dispatch:
  push:
    branches: [cursor/coolify-server-select-f065]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List Coolify targets
        env:
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          const apiBase = "https://coolify.fs0ciety.org/api/v1";
          const apiKey = process.env.COOLIFY_API_KEY;
          if (!apiKey) throw new Error("Missing COOLIFY_API_KEY");
          async function api(path) {
            const response = await fetch(`${apiBase}${path}`, {
              headers: { Authorization: `Bearer ${apiKey}`, Accept: "application/json" },
              signal: AbortSignal.timeout(30_000),
            });
            if (!response.ok) throw new Error(`Coolify GET ${path} returned HTTP ${response.status}`);
            return response.json();
          }
          function asArray(value) {
            if (Array.isArray(value)) return value;
            if (Array.isArray(value?.data)) return value.data;
            return [];
          }
          const servers = asArray(await api("/servers"));
          console.log("SERVERS", servers.length);
          for (const server of servers) {
            const settings = server.settings ?? {};
            console.log(JSON.stringify({
              uuid: server.uuid,
              name: server.name,
              ip: server.ip,
              description: server.description ?? null,
              proxy: server.proxy?.type ?? server.proxy?.status ?? null,
              is_reachable: settings.is_reachable ?? null,
              is_usable: settings.is_usable ?? null,
              server_role: settings.server_role ?? null,
              is_build_server: settings.is_build_server ?? null,
              is_coolify_host: settings.is_coolify_host ?? null,
              wildcard_domain: settings.wildcard_domain ?? null,
            }));
          }
          const projects = asArray(await api("/projects"));
          console.log("PROJECTS", projects.length);
          for (const project of projects) {
            console.log(JSON.stringify({ uuid: project.uuid, name: project.name, description: project.description ?? null }));
          }
          const applications = asArray(await api("/applications"));
          console.log("APPLICATIONS", applications.length);
          for (const app of applications) {
            console.log(JSON.stringify({
              uuid: app.uuid,
              name: app.name,
              fqdn: app.fqdn ?? null,
              status: app.status ?? null,
              build_pack: app.build_pack ?? null,
              git_repository: app.git_repository ?? null,
              git_branch: app.git_branch ?? null,
              server_uuid: app.server_uuid ?? app.destination?.server?.uuid ?? null,
              server_name: app.destination?.server?.name ?? null,
              destination_uuid: app.destination?.uuid ?? app.destination_uuid ?? null,
            }));
          }
          const services = asArray(await api("/services"));
          console.log("SERVICES", services.length);
          for (const service of services) {
            console.log(JSON.stringify({
              uuid: service.uuid,
              name: service.name,
              status: service.status ?? null,
              server_uuid: service.server_uuid ?? service.destination?.server?.uuid ?? null,
              server_name: service.server?.name ?? service.destination?.server?.name ?? null,
              fqdn: service.fqdn ?? null,
            }));
          }
          EOF
