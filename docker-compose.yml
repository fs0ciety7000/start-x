services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?Set SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - init_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks: [init]

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${SERVICE_PASSWORD_64_POSTGRES:?Set SERVICE_PASSWORD_64_POSTGRES}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${SERVICE_HEX_64_AUTH:?Set SERVICE_HEX_64_AUTH}
      BOOTSTRAP_SETUP_TOKEN: ${SERVICE_HEX_64_SETUP:?Set SERVICE_HEX_64_SETUP}
      RAIL_API_BASE_URL: ${RAIL_API_BASE_URL:-https://reseau.fs0ciety.org}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [init]

networks:
  init:
    driver: bridge

volumes:
  init_postgres:
